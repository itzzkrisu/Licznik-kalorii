<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licznik Kalorii i Makroskładników</title>
  
  <!-- Biblioteka Chart.js do wykresu wagi -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Biblioteka do skanowania kodów kreskowych -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #4caf50;
      --border-color: #e0e0e0;
      --input-bg: #ffffff;
      --modal-overlay: rgba(0, 0, 0, 0.5);
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #81c784;
      --border-color: #333333;
      --input-bg: #2a2a2a;
      --modal-overlay: rgba(0, 0, 0, 0.7);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .icon-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      font-size: 1.2rem;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .icon-btn:hover {
      background-color: var(--border-color);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    /* Okno Popover dla Kalkulatora */
    .calculator-modal {
      display: none;
      position: absolute;
      top: 50px;
      right: 0;
      width: 320px;
      z-index: 100;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .calculator-modal.active {
      display: block;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0;
    }

    /* Nawigacja Daty */
    .date-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    input[type="date"], input[type="text"], input[type="number"], select {
      background-color: var(--input-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      width: 100%;
      box-sizing: border-box;
    }

    /* Paski postępu makro */
    .macro-bar-container {
      margin-bottom: 12px;
    }

    .macro-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      margin-bottom: 4px;
    }

    .progress-bar {
      height: 10px;
      background-color: var(--border-color);
      border-radius: 5px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--accent-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Lista produktów w posiłku */
    .meal-section {
      margin-top: 15px;
    }

    .meal-title {
      font-weight: bold;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .delete-btn {
      background: #e53935;
      padding: 4px 8px;
      font-size: 0.8em;
    }

    .search-results {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-top: 5px;
      display: none;
    }

    .search-item {
      padding: 8px;
      cursor: pointer;
      border-bottom: 1px solid var(--border-color);
    }

    .search-item:hover {
      background-color: var(--border-color);
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 10px auto;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .vertical-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <h1>Dziennik Diety</h1>
    <div class="header-actions">
      <!-- Przycisk Zębatki -->
      <button id="settingsBtn" class="icon-btn" title="Kalkulator zapotrzebowania">⚙️</button>
      <!-- Przełącznik trybu -->
      <button id="themeToggleBtn">Tryb Ciemny</button>

      <!-- Ukryty Kalkulator Zapotrzebowania -->
      <div id="calculatorModal" class="card calculator-modal">
        <div class="modal-header">
          <h3 style="margin: 0;">Kalkulator BMR / TDEE</h3>
          <button id="closeCalcBtn" class="close-btn">&times;</button>
        </div>
        <div class="vertical-form">
          <input type="number" id="calcAge" placeholder="Wiek">
          <input type="number" id="calcWeight" placeholder="Waga (kg)">
          <input type="number" id="calcHeight" placeholder="Wzrost (cm)">
          <select id="calcGender">
            <option value="male">Mężczyzna</option>
            <option value="female">Kobieta</option>
          </select>
          <select id="calcActivity">
            <option value="1.2">Niska aktywność</option>
            <option value="1.375">Umiarkowana (1-3 treningi)</option>
            <option value="1.55">Średnia (3-5 treningów)</option>
            <option value="1.725">Wysoka (codziennie)</option>
          </select>
          <select id="calcGoal">
            <option value="maintain">Utrzymanie</option>
            <option value="cut">Redukcja (-15%)</option>
            <option value="bulk">Masa (+15%)</option>
          </select>
          <button id="calculateBmrBtn" style="width: 100%;">Oblicz i Zapisz Cele</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Pasek Nawigacji Daty -->
  <div class="card date-nav">
    <button id="prevDayBtn">&larr; Poprzedni</button>
    <input type="date" id="selectedDateInput" style="width: auto;">
    <button id="nextDayBtn">Następny &rarr;</button>
    <button id="todayBtn">Dzisiaj</button>
  </div>

  <!-- Podsumowanie dnia -->
  <div class="card">
    <h2>Podsumowanie Dnia</h2>
    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Kalorie: <span id="calVal">0</span> / <span id="calTarget">2000</span> kcal</span>
      </div>
      <div class="progress-bar"><div id="calFill" class="progress-fill"></div></div>
    </div>

    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Białko: <span id="proteinVal">0</span> / <span id="proteinTarget">125</span> g</span>
      </div>
      <div class="progress-bar"><div id="proteinFill" class="progress-fill"></div></div>
    </div>

    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Węglowodany: <span id="carbsVal">0</span> / <span id="carbsTarget">250</span> g</span>
      </div>
      <div class="progress-bar"><div id="carbsFill" class="progress-fill"></div></div>
    </div>

    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Tłuszcze: <span id="fatVal">0</span> / <span id="fatTarget">55</span> g</span>
      </div>
      <div class="progress-bar"><div id="fatFill" class="progress-fill"></div></div>
    </div>
  </div>

  <!-- Wyszukiwanie i Dodawanie Posiłków -->
  <div class="card">
    <h3>Dodaj Produkt</h3>
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <input type="text" id="searchInput" placeholder="Szukaj produktu (np. Jabłko, Kurczak)...">
      <button id="scanBtn" style="white-space: nowrap;">📷 Skaner</button>
    </div>

    <div id="reader"></div>
    <div id="searchResults" class="search-results"></div>

    <div class="grid-form">
      <select id="mealTypeSelect">
        <option value="breakfast">Śniadanie</option>
        <option value="lunch">Obiad</option>
        <option value="dinner">Kolacja</option>
        <option value="snacks">Przekąski</option>
      </select>
      <input type="number" id="weightInput" placeholder="Waga (g)" value="100">
      <button id="addFoodBtn">Dodaj do Dnia</button>
    </div>
  </div>

  <!-- Posiłki w danym dniu -->
  <div class="card">
    <h2>Posiłki</h2>
    <div class="meal-section">
      <div class="meal-title">Śniadanie</div>
      <div id="breakfastList"></div>
    </div>
    <div class="meal-section">
      <div class="meal-title">Obiad</div>
      <div id="lunchList"></div>
    </div>
    <div class="meal-section">
      <div class="meal-title">Kolacja</div>
      <div id="dinnerList"></div>
    </div>
    <div class="meal-section">
      <div class="meal-title">Przekąski</div>
      <div id="snacksList"></div>
    </div>
  </div>

  <!-- Wykres Wagi -->
  <div class="card">
    <h3>Śledzenie Wagi</h3>
    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
      <input type="number" id="weightTrackerInput" placeholder="Aktualna waga (kg)">
      <button id="addWeightLogBtn" style="white-space: nowrap;">Zapisz Pomiar</button>
    </div>
    <canvas id="weightChart"></canvas>
  </div>

</div>

<script>
  // --- LOKALNA BAZA DANYCH ---
  const localDb = [
    { name: "Jabłko", cal: 52, protein: 0.3, carbs: 14, fat: 0.2 },
    { name: "Pierś z kurczaka (surowa)", cal: 120, protein: 22.5, carbs: 0, fat: 2.6 },
    { name: "Ryż biały (surowy)", cal: 360, protein: 7, carbs: 79, fat: 0.7 },
    { name: "Jajko (1 szt. ~ 50g)", cal: 143, protein: 12.6, carbs: 0.7, fat: 9.5 },
    { name: "Owsianka (płatki)", cal: 366, protein: 11.9, carbs: 69.3, fat: 7.2 },
    { name: "Twaróg chudy", cal: 86, protein: 18, carbs: 3.5, fat: 0.5 },
    { name: "Chleb pszenny", cal: 265, protein: 9, carbs: 49, fat: 3.2 },
    { name: "Banan", cal: 89, protein: 1.1, carbs: 22.8, fat: 0.3 }
  ];

  // --- ZMIENNE STANU ---
  let selectedFood = null;
  let targets = JSON.parse(localStorage.getItem('user_targets')) || { cal: 2000, protein: 125, carbs: 250, fat: 55 };
  let weightHistory = JSON.parse(localStorage.getItem('weight_history')) || [];
  
  // Formatowanie daty YYYY-MM-DD
  function formatDate(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  let currentDate = formatDate(new Date());
  let meals = { breakfast: [], lunch: [], dinner: [], snacks: [] };

  // --- OBSŁUGĄ KALKULATORA W ZĘBATCE ---
  const settingsBtn = document.getElementById('settingsBtn');
  const calculatorModal = document.getElementById('calculatorModal');
  const closeCalcBtn = document.getElementById('closeCalcBtn');

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    calculatorModal.classList.toggle('active');
  });

  closeCalcBtn.addEventListener('click', () => {
    calculatorModal.classList.remove('active');
  });

  // Zamknij okienko przy kliknięciu poza nim
  document.addEventListener('click', (e) => {
    if (!calculatorModal.contains(e.target) && e.target !== settingsBtn) {
      calculatorModal.classList.remove('active');
    }
  });

  // --- WCZYTYWANIE I ZAPIS DANYCH DLA DANEJ DATY ---
  function loadMealsForDate(dateStr) {
    const saved = localStorage.getItem(`meals_${dateStr}`);
    if (saved) {
      meals = JSON.parse(saved);
    } else {
      meals = { breakfast: [], lunch: [], dinner: [], snacks: [] };
    }
    renderMeals();
    updateSummary();
  }

  function saveMeals() {
    localStorage.setItem(`meals_${currentDate}`, JSON.stringify(meals));
  }

  // --- NAWIGACJA DATĄ ---
  const dateInput = document.getElementById('selectedDateInput');
  dateInput.value = currentDate;

  dateInput.addEventListener('change', (e) => {
    if (e.target.value) {
      currentDate = e.target.value;
      loadMealsForDate(currentDate);
    }
  });

  document.getElementById('prevDayBtn').addEventListener('click', () => {
    let d = new Date(currentDate + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    currentDate = formatDate(d);
    dateInput.value = currentDate;
    loadMealsForDate(currentDate);
  });

  document.getElementById('nextDayBtn').addEventListener('click', () => {
    let d = new Date(currentDate + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    currentDate = formatDate(d);
    dateInput.value = currentDate;
    loadMealsForDate(currentDate);
  });

  document.getElementById('todayBtn').addEventListener('click', () => {
    currentDate = formatDate(new Date());
    dateInput.value = currentDate;
    loadMealsForDate(currentDate);
  });

  // --- WYSZUKIWARKA I OFF API ---
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  searchInput.addEventListener('input', async (e) => {
    const query = e.target.value.trim().toLowerCase();
    if (query.length < 2) {
      searchResults.style.display = 'none';
      return;
    }

    searchResults.innerHTML = '';
    
    // Szukaj lokalnie
    const localMatches = localDb.filter(f => f.name.toLowerCase().includes(query));
    localMatches.forEach(item => renderSearchResultItem(item));

    // Szukaj z Open Food Facts API
    try {
      const response = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=5`);
      const data = await response.json();
      if (data.products) {
        data.products.forEach(p => {
          if (p.product_name && p.nutriments) {
            const item = {
              name: p.product_name,
              cal: p.nutriments['energy-kcal_100g'] || 0,
              protein: p.nutriments.proteins_100g || 0,
              carbs: p.nutriments.carbohydrates_100g || 0,
              fat: p.nutriments.fat_100g || 0
            };
            renderSearchResultItem(item);
          }
        });
      }
    } catch (err) {
      console.log('Błąd zapytania do Open Food Facts API', err);
    }

    searchResults.style.display = 'block';
  });

  function renderSearchResultItem(item) {
    const div = document.createElement('div');
    div.className = 'search-item';
    div.textContent = `${item.name} (${item.cal} kcal / 100g)`;
    div.onclick = () => {
      selectedFood = item;
      searchInput.value = item.name;
      searchResults.style.display = 'none';
    };
    searchResults.appendChild(div);
  }

  // --- DODAWANIE PRODUKTU ---
  document.getElementById('addFoodBtn').addEventListener('click', () => {
    const weight = parseFloat(document.getElementById('weightInput').value);
    const mealType = document.getElementById('mealTypeSelect').value;

    if (!selectedFood && searchInput.value) {
      selectedFood = { name: searchInput.value, cal: 0, protein: 0, carbs: 0, fat: 0 };
    }

    if (!selectedFood || !weight) return;

    const multiplier = weight / 100;
    const foodToAdd = {
      id: Date.now(),
      name: selectedFood.name,
      weight: weight,
      cal: Math.round(selectedFood.cal * multiplier),
      protein: Math.round(selectedFood.protein * multiplier * 10) / 10,
      carbs: Math.round(selectedFood.carbs * multiplier * 10) / 10,
      fat: Math.round(selectedFood.fat * multiplier * 10) / 10
    };

    meals[mealType].push(foodToAdd);
    saveMeals();
    renderMeals();
    updateSummary();

    searchInput.value = '';
    selectedFood = null;
  });

  function deleteFood(mealType, id) {
    meals[mealType] = meals[mealType].filter(item => item.id !== id);
    saveMeals();
    renderMeals();
    updateSummary();
  }

  // --- RENDEROWANIE POSIŁKÓW ---
  function renderMeals() {
    ['breakfast', 'lunch', 'dinner', 'snacks'].forEach(type => {
      const container = document.getElementById(`${type}List`);
      container.innerHTML = '';
      meals[type].forEach(item => {
        const div = document.createElement('div');
        div.className = 'food-item';
        div.innerHTML = `
          <div>
            <strong>${item.name}</strong> - ${item.weight}g
            <br><small>${item.cal} kcal | B: ${item.protein}g | W: ${item.carbs}g | T: ${item.fat}g</small>
          </div>
          <button class="delete-btn" onclick="deleteFood('${type}', ${item.id})">X</button>
        `;
        container.appendChild(div);
      });
    });
  }

  // --- PODSUMOWANIE I PASKI POSTĘPU ---
  function updateSummary() {
    let totals = { cal: 0, protein: 0, carbs: 0, fat: 0 };

    Object.keys(meals).forEach(type => {
      meals[type].forEach(item => {
        totals.cal += item.cal;
        totals.protein += item.protein;
        totals.carbs += item.carbs;
        totals.fat += item.fat;
      });
    });

    document.getElementById('calVal').textContent = Math.round(totals.cal);
    document.getElementById('proteinVal').textContent = Math.round(totals.protein);
    document.getElementById('carbsVal').textContent = Math.round(totals.carbs);
    document.getElementById('fatVal').textContent = Math.round(totals.fat);

    document.getElementById('calTarget').textContent = targets.cal;
    document.getElementById('proteinTarget').textContent = targets.protein;
    document.getElementById('carbsTarget').textContent = targets.carbs;
    document.getElementById('fatTarget').textContent = targets.fat;

    document.getElementById('calFill').style.width = `${Math.min(100, (totals.cal / targets.cal) * 100)}%`;
    document.getElementById('proteinFill').style.width = `${Math.min(100, (totals.protein / targets.protein) * 100)}%`;
    document.getElementById('carbsFill').style.width = `${Math.min(100, (totals.carbs / targets.carbs) * 100)}%`;
    document.getElementById('fatFill').style.width = `${Math.min(100, (totals.fat / targets.fat) * 100)}%`;
  }

  // --- KALKULATOR BMR / TDEE ---
  document.getElementById('calculateBmrBtn').addEventListener('click', () => {
    const age = parseFloat(document.getElementById('calcAge').value);
    const weight = parseFloat(document.getElementById('calcWeight').value);
    const height = parseFloat(document.getElementById('calcHeight').value);
    const gender = document.getElementById('calcGender').value;
    const activity = parseFloat(document.getElementById('calcActivity').value);
    const goal = document.getElementById('calcGoal').value;

    if (!age || !weight || !height) return;

    // Wzór Mifflina-St Jeora
    let bmr = (10 * weight) + (6.25 * height) - (5 * age);
    bmr += (gender === 'male') ? 5 : -161;

    let tdee = bmr * activity;

    if (goal === 'cut') tdee *= 0.85;
    if (goal === 'bulk') tdee *= 1.15;

    const calTarget = Math.round(tdee);
    targets = {
      cal: calTarget,
      protein: Math.round((calTarget * 0.25) / 4),
      carbs: Math.round((calTarget * 0.50) / 4),
      fat: Math.round((calTarget * 0.25) / 9)
    };

    localStorage.setItem('user_targets', JSON.stringify(targets));
    updateSummary();
    calculatorModal.classList.remove('active');
    alert(`Obliczono cele: ${calTarget} kcal dziennie!`);
  });

  // --- SKANER KODÓW KRESKOWYCH ---
  let html5QrcodeScanner = null;
  document.getElementById('scanBtn').addEventListener('click', () => {
    const readerDiv = document.getElementById('reader');
    if (html5QrcodeScanner) {
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
      readerDiv.innerHTML = '';
      return;
    }

    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render((decodedText) => {
      fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 1) {
            const p = data.product;
            selectedFood = {
              name: p.product_name || "Produkt ze skanera",
              cal: p.nutriments['energy-kcal_100g'] || 0,
              protein: p.nutriments.proteins_100g || 0,
              carbs: p.nutriments.carbohydrates_100g || 0,
              fat: p.nutriments.fat_100g || 0
            };
            searchInput.value = selectedFood.name;
          } else {
            alert('Nie znaleziono produktu w bazie!');
          }
        });
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
    });
  });

  // --- WYKRES WAGI ---
  const ctx = document.getElementById('weightChart').getContext('2d');
  let weightChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: weightHistory.map(entry => entry.date),
      datasets: [{
        label: 'Waga (kg)',
        data: weightHistory.map(entry => entry.weight),
        borderColor: '#4caf50',
        tension: 0.2,
        fill: false
      }]
    },
    options: { responsive: true }
  });

  document.getElementById('addWeightLogBtn').addEventListener('click', () => {
    const val = parseFloat(document.getElementById('weightTrackerInput').value);
    if (!val) return;

    weightHistory.push({ date: currentDate, weight: val });
    localStorage.setItem('weight_history', JSON.stringify(weightHistory));

    weightChart.data.labels = weightHistory.map(e => e.date);
    weightChart.data.datasets[0].data = weightHistory.map(e => e.weight);
    weightChart.update();
    document.getElementById('weightTrackerInput').value = '';
  });

  // --- TRYB CIEMNY ---
  const themeBtn = document.getElementById('themeToggleBtn');
  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    themeBtn.textContent = isDark ? 'Tryb Jasny' : 'Tryb Ciemny';
  });

  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    themeBtn.textContent = 'Tryb Jasny';
  }

  // Start aplikacji
  loadMealsForDate(currentDate);
</script>

</body>
</html>
