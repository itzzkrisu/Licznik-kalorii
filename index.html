<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Kalorii & Fit App</title>
  
  <!-- Biblioteki zewnętrzne: Wykresy (Chart.js) oraz Skaner Kodów (Html5Qrcode) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --primary-color: #4caf50;
      --water-color: #2196f3;
      --workout-color: #ff9800;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 1px solid var(--border-color);
    }

    h3 {
      margin-bottom: 15px;
    }

    input, select, button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 14px;
    }

    .btn {
      cursor: pointer;
      background-color: var(--primary-color);
      color: white;
      border: none;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-water {
      background-color: var(--water-color);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .food-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .food-item:last-child {
      border-bottom: none;
    }

    .delete-btn {
      background-color: #e53935;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* Paski Postępu */
    .macro-bar-container {
      margin-bottom: 12px;
    }
    .macro-labels {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 4px;
    }
    .progress-bar {
      height: 10px;
      background-color: var(--border-color);
      border-radius: 5px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary-color);
      transition: width 0.3s ease;
    }
    .progress-fill-water { background-color: var(--water-color); }

    /* Przełącznik Wody */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--water-color);
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #e53935;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #reader {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Nagłówek -->
  <header>
    <h2>FitTracker 🥑</h2>
    <button id="themeToggleBtn" class="btn" style="background-color: #666;">Tryb Ciemny</button>
  </header>

  <!-- Podsumowanie Makroskładników -->
  <div class="card">
    <h3>Dzienny Bilans 📊</h3>
    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Kalorie: <span id="calVal">0</span> / <span id="calTarget">2000</span> kcal</span>
      </div>
      <div class="progress-bar"><div id="calFill" class="progress-fill"></div></div>
    </div>
    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Białko: <span id="proteinVal">0</span> / <span id="proteinTarget">125</span> g</span>
      </div>
      <div class="progress-bar"><div id="proteinFill" class="progress-fill"></div></div>
    </div>
    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Węglowodany: <span id="carbsVal">0</span> / <span id="carbsTarget">250</span> g</span>
      </div>
      <div class="progress-bar"><div id="carbsFill" class="progress-fill"></div></div>
    </div>
    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Tłuszcze: <span id="fatVal">0</span> / <span id="fatTarget">55</span> g</span>
      </div>
      <div class="progress-bar"><div id="fatFill" class="progress-fill"></div></div>
    </div>
    <button id="openCalcBtn" class="btn" style="margin-top: 10px; width: 100%;">Oblicz swoje zapotrzebowanie (BMR/TDEE)</button>
  </div>

  <!-- Nawodnienie Wody z Przełącznikiem -->
  <div class="card">
    <h3>Spożycie Wody 💧</h3>
    <div class="macro-bar-container">
      <div class="macro-labels">
        <span>Wypito: <span id="waterVal">0</span> / <span id="waterTarget">2500</span> ml</span>
      </div>
      <div class="progress-bar"><div id="waterFill" class="progress-fill progress-fill-water"></div></div>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; align-items: center;">
      <button id="waterBtn250" class="btn-water">+ 250 ml 🥤</button>
      <button id="waterBtn500" class="btn-water">+ 500 ml 🍼</button>
      
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 0.9em; font-weight: bold; color: var(--water-color);">Dodaj</span>
        <label class="switch">
          <input type="checkbox" id="waterToggle">
          <span class="slider"></span>
        </label>
        <span style="font-size: 0.9em; font-weight: bold; color: #e53935;">Odejmij</span>
      </div>
    </div>
  </div>

  <!-- Sekcja Treningów z Automatycznym Przelicznikiem -->
  <div class="card">
    <h3>Dziennik Treningowy 🏋️‍♂️</h3>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
      <select id="workoutTypeSelect" style="flex: 2; min-width: 160px;">
        <option value="" disabled selected>Wybierz aktywność...</option>
        <option value="bieganie_szybkie">Bieganie (szybkie)</option>
        <option value="bieganie_umiarkowane">Bieganie (umiarkowane)</option>
        <option value="silownia">Trening siłowy</option>
        <option value="plywanie">Pływanie</option>
        <option value="rower">Jazda na rowerze</option>
        <option value="lekkoatletyka">Lekkoatletyka / Rzuty</option>
        <option value="spacer">Spacer / Marsz</option>
        <option value="custom">Własna aktywność...</option>
      </select>

      <input type="text" id="workoutNameInput" placeholder="Nazwa treningu" style="flex: 2; min-width: 140px; display: none;">
      <input type="number" id="workoutDurationInput" placeholder="Czas (min)" style="flex: 1; min-width: 90px;">
      <input type="number" id="workoutCalInput" placeholder="Kcal" style="flex: 1; min-width: 80px;">
      <button id="addWorkoutBtn" class="btn" style="background-color: var(--workout-color);">Dodaj</button>
    </div>

    <div id="workoutList"></div>

    <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; font-weight: bold;">
      <span>Łączny czas: <span id="totalWorkoutTime">0</span> min</span>
      <span>Spalone: <span id="totalWorkoutCal">0</span> kcal 🔥</span>
    </div>
  </div>

  <!-- Posiłki i Skaner -->
  <div class="card">
    <h3>Posiłki 🍎</h3>
    <button id="scanBtn" class="btn" style="background-color: #9c27b0; margin-bottom: 10px; width: 100%;">Skanuj kod kreskowy 📷</button>
    <div id="reader"></div>

    <div id="breakfastList"></div>
    <div id="lunchList"></div>
    <div id="dinnerList"></div>
    <div id="snacksList"></div>
  </div>

  <!-- Wykres Wagi -->
  <div class="card">
    <h3>Waga i Progres 📈</h3>
    <canvas id="weightChart"></canvas>
    <div style="display: flex; gap: 10px; margin-top: 15px;">
      <input type="number" id="weightTrackerInput" step="0.1" placeholder="Wpisz dzisiejszą wagę (kg)">
      <button id="addWeightLogBtn" class="btn">Zapisz</button>
    </div>
  </div>
</div>

<!-- Modal Kalkulatora BMR -->
<div id="calculatorModal" class="modal">
  <div class="modal-content">
    <h3>Kalkulator Kalorii</h3>
    <input type="number" id="calcAge" placeholder="Wiek">
    <input type="number" id="calcWeight" placeholder="Waga (kg)">
    <input type="number" id="calcHeight" placeholder="Wzrost (cm)">
    <select id="calcGender">
      <option value="male">Mężczyzna</option>
      <option value="female">Kobieta</option>
    </select>
    <select id="calcActivity">
      <option value="1.2">Niska aktywność</option>
      <option value="1.375">Umiarkowana (1-3 treningi)</option>
      <option value="1.55">Wysoka (3-5 treningów)</option>
      <option value="1.725">Bardzo wysoka</option>
    </select>
    <select id="calcGoal">
      <option value="maintain">Utrzymanie wagi</option>
      <option value="cut">Redukcja (-15%)</option>
      <option value="bulk">Masa (+15%)</option>
    </select>
    <button id="calculateBmrBtn" class="btn">Zapisz Cel</button>
    <button id="closeCalcBtn" class="btn" style="background-color: #666;">Zamknij</button>
  </div>
</div>

<script>
  // Globalne dane
  let currentDate = new Date().toISOString().split('T')[0];
  let targets = JSON.parse(localStorage.getItem('user_targets')) || { cal: 2000, protein: 125, carbs: 250, fat: 55, water: 2500 };
  let meals = { breakfast: [], lunch: [], dinner: [], snacks: [] };
  let waterIntake = parseInt(localStorage.getItem(`water_${currentDate}`)) || 0;
  let weightHistory = JSON.parse(localStorage.getItem('weight_history')) || [];
  let workouts = [];

  // Przeliczniki treningowe (kcal/min)
  const workoutRates = {
    bieganie_szybkie: 11.5,
    bieganie_umiarkowane: 9.0,
    silownia: 6.5,
    plywanie: 8.5,
    rower: 7.5,
    lekkoatletyka: 6.5,
    spacer: 4.0
  };

  // DOM Loaded Start
  document.addEventListener('DOMContentLoaded', () => {
    updateSummary();
    updateWaterUI();
    loadMealsForDate(currentDate);
    loadWorkoutsForDate(currentDate);
    initWeightChart();
    setupEventListeners();
  });

  // --- PODSUMOWANIE I PASKI ---
  function updateSummary() {
    let totals = { cal: 0, protein: 0, carbs: 0, fat: 0 };
    Object.keys(meals).forEach(type => {
      meals[type].forEach(item => {
        totals.cal += item.cal || 0;
        totals.protein += item.protein || 0;
        totals.carbs += item.carbs || 0;
        totals.fat += item.fat || 0;
      });
    });

    document.getElementById('calVal').textContent = Math.round(totals.cal);
    document.getElementById('proteinVal').textContent = Math.round(totals.protein);
    document.getElementById('carbsVal').textContent = Math.round(totals.carbs);
    document.getElementById('fatVal').textContent = Math.round(totals.fat);

    document.getElementById('calTarget').textContent = targets.cal;
    document.getElementById('proteinTarget').textContent = targets.protein;
    document.getElementById('carbsTarget').textContent = targets.carbs;
    document.getElementById('fatTarget').textContent = targets.fat;

    document.getElementById('calFill').style.width = `${Math.min(100, (totals.cal / targets.cal) * 100)}%`;
    document.getElementById('proteinFill').style.width = `${Math.min(100, (totals.protein / targets.protein) * 100)}%`;
    document.getElementById('carbsFill').style.width = `${Math.min(100, (totals.carbs / targets.carbs) * 100)}%`;
    document.getElementById('fatFill').style.width = `${Math.min(100, (totals.fat / targets.fat) * 100)}%`;
  }

  // --- OBSŁUGA WODY ---
  function updateWaterUI() {
    const target = targets.water || 2500;
    document.getElementById('waterVal').textContent = waterIntake;
    document.getElementById('waterTarget').textContent = target;
    document.getElementById('waterFill').style.width = `${Math.min(100, (waterIntake / target) * 100)}%`;
  }

  let isRemovingWater = false;
  document.getElementById('waterToggle').addEventListener('change', (e) => {
    isRemovingWater = e.target.checked;
    const btn250 = document.getElementById('waterBtn250');
    const btn500 = document.getElementById('waterBtn500');

    if (isRemovingWater) {
      btn250.textContent = '- 250 ml 🥤';
      btn500.textContent = '- 500 ml 🍼';
      btn250.style.backgroundColor = '#e53935';
      btn500.style.backgroundColor = '#e53935';
    } else {
      btn250.textContent = '+ 250 ml 🥤';
      btn500.textContent = '+ 500 ml 🍼';
      btn250.style.backgroundColor = 'var(--water-color)';
      btn500.style.backgroundColor = 'var(--water-color)';
    }
  });

  function modifyWater(amount) {
    if (isRemovingWater) {
      waterIntake = Math.max(0, waterIntake - amount);
    } else {
      waterIntake += amount;
    }
    localStorage.setItem(`water_${currentDate}`, waterIntake);
    updateWaterUI();
  }

  document.getElementById('waterBtn250').addEventListener('click', () => modifyWater(250));
  document.getElementById('waterBtn500').addEventListener('click', () => modifyWater(500));

  // --- OBSŁUGA TRENINGÓW ---
  function autoCalculateBurnedCalories() {
    const select = document.getElementById('workoutTypeSelect');
    const durationInput = document.getElementById('workoutDurationInput');
    const calInput = document.getElementById('workoutCalInput');

    const selectedType = select.value;
    const duration = parseFloat(durationInput.value) || 0;

    if (selectedType && selectedType !== 'custom' && workoutRates[selectedType]) {
      calInput.value = Math.round(duration * workoutRates[selectedType]);
    }
  }

  function loadWorkoutsForDate(date) {
    workouts = JSON.parse(localStorage.getItem(`workouts_${date}`)) || [];
    renderWorkouts();
  }

  function renderWorkouts() {
    const container = document.getElementById('workoutList');
    container.innerHTML = '';
    let totalTime = 0;
    let totalCal = 0;

    workouts.forEach((item, index) => {
      totalTime += item.duration;
      totalCal += item.cal;

      const div = document.createElement('div');
      div.className = 'food-item';
      div.innerHTML = `
        <div>
          <strong>${item.name}</strong> - ${item.duration} min
          <br><small>🔥 ${item.cal} kcal</small>
        </div>
        <button class="delete-btn" onclick="deleteWorkout(${index})">X</button>
      `;
      container.appendChild(div);
    });

    document.getElementById('totalWorkoutTime').textContent = totalTime;
    document.getElementById('totalWorkoutCal').textContent = Math.round(totalCal);
  }

  function deleteWorkout(index) {
    workouts.splice(index, 1);
    localStorage.setItem(`workouts_${currentDate}`, JSON.stringify(workouts));
    renderWorkouts();
  }

  // --- RENDEROWANIE POSIŁKÓW ---
  function loadMealsForDate(date) {
    meals = JSON.parse(localStorage.getItem(`meals_${date}`)) || { breakfast: [], lunch: [], dinner: [], snacks: [] };
    renderMeals();
  }

  function renderMeals() {
    ['breakfast', 'lunch', 'dinner', 'snacks'].forEach(type => {
      const container = document.getElementById(`${type}List`);
      if (!container) return;
      container.innerHTML = '';
      meals[type].forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'food-item';
        div.innerHTML = `
          <div>
            <strong>${item.name}</strong> ${item.weight ? `- ${item.weight}g` : ''}
            <br><small>${item.cal} kcal | B: ${item.protein}g | W: ${item.carbs}g | T: ${item.fat}g</small>
          </div>
          <button class="delete-btn" onclick="deleteFood('${type}', ${index})">X</button>
        `;
        container.appendChild(div);
      });
    });
  }

  function deleteFood(type, index) {
    meals[type].splice(index, 1);
    localStorage.setItem(`meals_${currentDate}`, JSON.stringify(meals));
    renderMeals();
    updateSummary();
  }

  // --- OBSŁUGA EVENTÓW ---
  function setupEventListeners() {
    // Treningi
    const workoutTypeSelect = document.getElementById('workoutTypeSelect');
    const workoutDurationInput = document.getElementById('workoutDurationInput');
    const workoutNameInput = document.getElementById('workoutNameInput');

    workoutTypeSelect.addEventListener('change', () => {
      if (workoutTypeSelect.value === 'custom') {
        workoutNameInput.style.display = 'block';
        workoutNameInput.value = '';
        workoutNameInput.focus();
        document.getElementById('workoutCalInput').value = '';
      } else {
        workoutNameInput.style.display = 'none';
        autoCalculateBurnedCalories();
      }
    });

    workoutDurationInput.addEventListener('input', autoCalculateBurnedCalories);

    document.getElementById('addWorkoutBtn').addEventListener('click', () => {
      const selectedType = workoutTypeSelect.value;
      let name = selectedType === 'custom' ? workoutNameInput.value.trim() : (workoutTypeSelect.options[workoutTypeSelect.selectedIndex]?.text || '');
      const duration = parseFloat(workoutDurationInput.value) || 0;
      const cal = parseFloat(document.getElementById('workoutCalInput').value) || 0;

      if (!name || duration <= 0) {
        alert('Wybierz aktywność i wpisz czas trwania!');
        return;
      }

      workouts.push({ name, duration, cal });
      localStorage.setItem(`workouts_${currentDate}`, JSON.stringify(workouts));
      renderWorkouts();

      workoutTypeSelect.value = '';
      workoutNameInput.style.display = 'none';
      workoutNameInput.value = '';
      workoutDurationInput.value = '';
      document.getElementById('workoutCalInput').value = '';
    });

    // BMR Modal
    const modal = document.getElementById('calculatorModal');
    document.getElementById('openCalcBtn').onclick = () => modal.classList.add('active');
    document.getElementById('closeCalcBtn').onclick = () => modal.classList.remove('active');

    document.getElementById('calculateBmrBtn').addEventListener('click', () => {
      const age = parseFloat(document.getElementById('calcAge').value);
      const weight = parseFloat(document.getElementById('calcWeight').value);
      const height = parseFloat(document.getElementById('calcHeight').value);
      const gender = document.getElementById('calcGender').value;
      const activity = parseFloat(document.getElementById('calcActivity').value);
      const goal = document.getElementById('calcGoal').value;

      if (!age || !weight || !height) return;

      let bmr = (10 * weight) + (6.25 * height) - (5 * age);
      bmr += (gender === 'male') ? 5 : -161;
      let tdee = bmr * activity;

      if (goal === 'cut') tdee *= 0.85;
      if (goal === 'bulk') tdee *= 1.15;

      const calTarget = Math.round(tdee);
      targets = {
        cal: calTarget,
        protein: Math.round((calTarget * 0.25) / 4),
        carbs: Math.round((calTarget * 0.50) / 4),
        fat: Math.round((calTarget * 0.25) / 9),
        water: targets.water || 2500
      };

      localStorage.setItem('user_targets', JSON.stringify(targets));
      updateSummary();
      updateWaterUI();
      modal.classList.remove('active');
    });

    // Motyw Ciemny
    const themeBtn = document.getElementById('themeToggleBtn');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeBtn.textContent = isDark ? 'Tryb Jasny' : 'Tryb Ciemny';
    });
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      themeBtn.textContent = 'Tryb Jasny';
    }
  }

  // --- SKANER KODÓW ---
  let html5QrcodeScanner = null;
  document.getElementById('scanBtn').addEventListener('click', () => {
    const readerDiv = document.getElementById('reader');
    if (html5QrcodeScanner) {
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
      readerDiv.innerHTML = '';
      return;
    }
    html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render((decodedText) => {
      fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 1) {
            const p = data.product;
            alert(`Znaleziono: ${p.product_name || 'Produkt'}\nKcal/100g: ${p.nutriments['energy-kcal_100g'] || 0}`);
          } else {
            alert('Nie znaleziono produktu!');
          }
        });
      html5QrcodeScanner.clear();
      html5QrcodeScanner = null;
    });
  });

  // --- WYKRES WAGI ---
  let weightChart;
  function initWeightChart() {
    const ctx = document.getElementById('weightChart').getContext('2d');
    weightChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: weightHistory.map(e => e.date),
        datasets: [{
          label: 'Waga (kg)',
          data: weightHistory.map(e => e.weight),
          borderColor: '#4caf50',
          tension: 0.2,
          fill: false
        }]
      },
      options: { responsive: true }
    });

    document.getElementById('addWeightLogBtn').addEventListener('click', () => {
      const val = parseFloat(document.getElementById('weightTrackerInput').value);
      if (!val) return;
      weightHistory.push({ date: currentDate, weight: val });
      localStorage.setItem('weight_history', JSON.stringify(weightHistory));

      weightChart.data.labels = weightHistory.map(e => e.date);
      weightChart.data.datasets[0].data = weightHistory.map(e => e.weight);
      weightChart.update();
      document.getElementById('weightTrackerInput').value = '';
    });
