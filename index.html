<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Licznik Kalorii & Wagi</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Skaner kodów kreskowych HTML5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --bg-card: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --accent: #10b981;
      --accent-hover: #059669;
      --border: #e5e7eb;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg-primary: #111827;
      --bg-card: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #10b981;
      --accent-hover: #34d399;
      --border: #374151;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); padding: 15px; transition: all 0.3s ease; }
    .container { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .theme-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 8px 12px; border-radius: 8px; cursor: pointer; }

    .card { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; color: var(--text-main); }

    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; text-align: center; }
    .summary-box { padding: 10px; background: var(--bg-primary); border-radius: 8px; }
    .summary-box span { display: block; font-size: 0.8rem; color: var(--text-muted); }
    .summary-box strong { font-size: 1.2rem; color: var(--accent); }

    .meal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; margin-top: 15px; }
    .meal-header h3 { font-size: 1rem; }
    .add-btn { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    
    .food-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .food-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-primary); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; }
    .food-info span { font-size: 0.75rem; color: var(--text-muted); display: block; }
    .delete-btn { color: #ef4444; background: none; border: none; font-size: 1.1rem; cursor: pointer; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal.active { display: flex; }
    .modal-content { background: var(--bg-card); width: 90%; max-width: 450px; padding: 20px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
    .modal-content h3 { margin-bottom: 15px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-main); }

    .scanner-btn { width: 100%; background: #3b82f6; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    #interactive { width: 100%; margin-bottom: 15px; border-radius: 8px; overflow: hidden; display: none; }

    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
    .cancel-btn { background: var(--border); color: var(--text-main); border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

    /* Weight Form */
    .weight-form { display: flex; gap: 10px; margin-bottom: 15px; }
    .weight-form input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-main); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Licznik Kalorii</h1>
    <button class="theme-btn" id="themeToggle">🌙 Tryb</button>
  </header>

  <!-- Podsumowanie dnia -->
  <section class="card">
    <div class="card-title">Dzisiejsze podsumowanie</div>
    <div class="summary-grid">
      <div class="summary-box">
        <span>Kalorie</span>
        <strong id="totalKcal">0 / 2000 kcal</strong>
      </div>
      <div class="summary-box">
        <span>Białko</span>
        <strong id="totalProtein">0g</strong>
      </div>
      <div class="summary-box">
        <span>Węglowodany</span>
        <strong id="totalCarbs">0g</strong>
      </div>
      <div class="summary-box">
        <span>Tłuszcze</span>
        <strong id="totalFat">0g</strong>
      </div>
    </div>
  </section>

  <!-- Posiłki -->
  <section class="card">
    <div class="card-title">Posiłki</div>
    
    <div class="meal-header">
      <h3>🥣 Śniadanie</h3>
      <button class="add-btn" onclick="openModal('breakfast')">+ Dodaj</button>
    </div>
    <ul class="food-list" id="list-breakfast"></ul>

    <div class="meal-header">
      <h3>🍲 Obiad</h3>
      <button class="add-btn" onclick="openModal('lunch')">+ Dodaj</button>
    </div>
    <ul class="food-list" id="list-lunch"></ul>

    <div class="meal-header">
      <h3>🥗 Kolacja</h3>
      <button class="add-btn" onclick="openModal('dinner')">+ Dodaj</button>
    </div>
    <ul class="food-list" id="list-dinner"></ul>

    <div class="meal-header">
      <h3>🍎 Przekąski</h3>
      <button class="add-btn" onclick="openModal('snack')">+ Dodaj</button>
    </div>
    <ul class="food-list" id="list-snack"></ul>
  </section>

  <!-- Waga i Wykres -->
  <section class="card">
    <div class="card-title">Postęp Wagi</div>
    <div class="weight-form">
      <input type="number" step="0.1" id="weightInput" placeholder="Wpisz wagę (kg)">
      <button class="add-btn" onclick="addWeight()">Zapisz</button>
    </div>
    <canvas id="weightChart"></canvas>
  </section>
</div>

<!-- Modal Dodawania Produktu -->
<div class="modal" id="foodModal">
  <div class="modal-content">
    <h3>Dodaj produkt</h3>
    
    <!-- Skaner kodów -->
    <button class="scanner-btn" id="startScanBtn" onclick="toggleScanner()">📷 Skanuj kod kreskowy</button>
    <div id="interactive"></div>

    <div class="form-group">
      <label>🔍 Wybierz z gotowej bazy</label>
      <select id="presetSelect" onchange="applyPreset()">
        <option value="">-- Wybierz produkt --</option>
      </select>
    </div>

    <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border);">

    <div class="form-group">
      <label>Nazwa produktu</label>
      <input type="text" id="foodName" placeholder="np. Banan">
    </div>
    <div class="form-group">
      <label>Waga (g)</label>
      <input type="number" id="foodWeight" value="100">
    </div>
    <div class="form-group">
      <label>Kalorie (kcal na 100g)</label>
      <input type="number" id="foodKcal">
    </div>
    <div class="form-group">
      <label>Białko (g na 100g)</label>
      <input type="number" id="foodProtein" step="0.1">
    </div>
    <div class="form-group">
      <label>Węglowodany (g na 100g)</label>
      <input type="number" id="foodCarbs" step="0.1">
    </div>
    <div class="form-group">
      <label>Tłuszcze (g na 100g)</label>
      <input type="number" id="foodFat" step="0.1">
    </div>

    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Anuluj</button>
      <button class="add-btn" onclick="saveFood()">Dodaj do posiłku</button>
    </div>
  </div>
</div>

<script>
  // Predefiniowana baza produktów
  const defaultProducts = [
    { name: "Jajko całe (1 szt ~50g)", kcal: 143, protein: 12.6, carbs: 0.7, fat: 9.5 },
    { name: "Banan", kcal: 89, protein: 1.1, carbs: 22.8, fat: 0.3 },
    { name: "Pierś z kurczaka", kcal: 165, protein: 31, carbs: 0, fat: 3.6 },
    { name: "Skyr naturalny", kcal: 66, protein: 12, carbs: 4, fat: 0 },
    { name: "Płatki owsiane", kcal: 366, protein: 11.9, carbs: 69.3, fat: 7.2 },
    { name: "Ryż biały (surowy)", kcal: 350, protein: 6.7, carbs: 78.9, fat: 0.7 },
    { name: "Chleb pszenno-żytni", kcal: 247, protein: 8.8, carbs: 51.5, fat: 1.3 }
  ];

  let currentMeal = '';
  let appData = JSON.parse(localStorage.getItem('calorieAppData')) || {
    meals: { breakfast: [], lunch: [], dinner: [], snack: [] },
    weights: []
  };

  let html5QrcodeScanner = null;

  // Inicjalizacja
  document.addEventListener("DOMContentLoaded", () => {
    initTheme();
    populatePresets();
    renderMeals();
    initChart();
  });

  // Motyw Light/Dark
  function initTheme() {
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  }

  // Wypełnij listę rozwijaną
  function populatePresets() {
    const select = document.getElementById('presetSelect');
    select.innerHTML = '<option value="">-- Wybierz produkt --</option>';
    defaultProducts.forEach((p, idx) => {
      select.innerHTML += `<option value="${idx}">${p.name}</option>`;
    });
  }

  function applyPreset() {
    const idx = document.getElementById('presetSelect').value;
    if (idx === "") return;
    const prod = defaultProducts[idx];
    document.getElementById('foodName').value = prod.name;
    document.getElementById('foodKcal').value = prod.kcal;
    document.getElementById('foodProtein').value = prod.protein;
    document.getElementById('foodCarbs').value = prod.carbs;
    document.getElementById('foodFat').value = prod.fat;
  }

  // Modal
  function openModal(meal) {
    currentMeal = meal;
    document.getElementById('foodModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('foodModal').classList.remove('active');
    stopScanner();
    clearModalInputs();
  }

  function clearModalInputs() {
    document.getElementById('foodName').value = '';
    document.getElementById('foodWeight').value = '100';
    document.getElementById('foodKcal').value = '';
    document.getElementById('foodProtein').value = '';
    document.getElementById('foodCarbs').value = '';
    document.getElementById('foodFat').value = '';
    document.getElementById('presetSelect').value = '';
  }

  // Obsidian / Open Food Facts Skaner Kodów
  function toggleScanner() {
    const scannerDiv = document.getElementById('interactive');
    if (scannerDiv.style.display === 'block') {
      stopScanner();
    } else {
      startScanner();
    }
  }

  function startScanner() {
    const scannerDiv = document.getElementById('interactive');
    scannerDiv.style.display = 'block';
    document.getElementById('startScanBtn').innerText = '❌ Zamknij skaner';

    html5QrcodeScanner = new Html5Qrcode("interactive");
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      (decodedText) => {
        // Kod zeskanowany pomyślnie
        stopScanner();
        fetchProductFromOFF(decodedText);
      },
      () => {} // Ignoruj błędy szukania w każdej klatce
    ).catch(err => {
      alert("Nie udało się uruchomić aparatu. Upewnij się, że dałeś uprawnienia w przeglądarce!");
      stopScanner();
    });
  }

  function stopScanner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        html5QrcodeScanner = null;
        document.getElementById('interactive').style.display = 'none';
        document.getElementById('startScanBtn').innerText = '📷 Skanuj kod kreskowy';
      }).catch(() => {});
    }
  }

  // Pobieranie danych z Open Food Facts API
  function fetchProductFromOFF(barcode) {
    alert("Zeskanowano kod: " + barcode + ". Szukam w bazie...");
    fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`)
      .then(res => res.json())
      .then(data => {
        if (data.status === 1) {
          const prod = data.product;
          const nutriments = prod.nutriments;

          document.getElementById('foodName').value = prod.product_name_pl || prod.product_name || "Produkt z kodu";
          document.getElementById('foodKcal').value = Math.round(nutriments['energy-kcal_100g'] || nutriments['energy-kcal'] || 0);
          document.getElementById('foodProtein').value = Math.round((nutriments.proteins_100g || 0) * 10) / 10;
          document.getElementById('foodCarbs').value = Math.round((nutriments.carbohydrates_100g || 0) * 10) / 10;
          document.getElementById('foodFat').value = Math.round((nutriments.fat_100g || 0) * 10) / 10;
        } else {
          alert("Nie znaleziono produktu w bazie Open Food Facts.");
        }
      })
      .catch(() => alert("Błąd podczas połączenia z bazą danych."));
  }

  // Zapisywanie Produktu
  function saveFood() {
    const name = document.getElementById('foodName').value;
    const weight = parseFloat(document.getElementById('foodWeight').value) || 100;
    const kcal100 = parseFloat(document.getElementById('foodKcal').value) || 0;
    const p100 = parseFloat(document.getElementById('foodProtein').value) || 0;
    const c100 = parseFloat(document.getElementById('foodCarbs').value) || 0;
    const f100 = parseFloat(document.getElementById('foodFat').value) || 0;

    if (!name) return alert("Podaj nazwę produktu!");

    const ratio = weight / 100;
    const item = {
      id: Date.now(),
      name: `${name} (${weight}g)`,
      kcal: Math.round(kcal100 * ratio),
      protein: Math.round(p100 * ratio * 10) / 10,
      carbs: Math.round(c100 * ratio * 10) / 10,
      fat: Math.round(f100 * ratio * 10) / 10
    };

    appData.meals[currentMeal].push(item);
    saveData();
    renderMeals();
    closeModal();
  }

  function deleteFood(meal, id) {
    appData.meals[meal] = appData.meals[meal].filter(item => item.id !== id);
    saveData();
    renderMeals();
  }

  function renderMeals() {
    let tKcal = 0, tP = 0, tC = 0, tF = 0;

    ['breakfast', 'lunch', 'dinner', 'snack'].forEach(meal => {
      const listEl = document.getElementById(`list-${meal}`);
      listEl.innerHTML = '';
      appData.meals[meal].forEach(item => {
        tKcal += item.kcal;
        tP += item.protein;
        tC += item.carbs;
        tF += item.fat;

        listEl.innerHTML += `
          <li class="food-item">
            <div class="food-info">
              <strong>${item.name}</strong>
              <span>${item.kcal} kcal | B: ${item.protein}g | W: ${item.carbs}g | T: ${item.fat}g</span>
            </div>
            <button class="delete-btn" onclick="deleteFood('${meal}', ${item.id})">🗑</button>
          </li>
        `;
      });
    });

    document.getElementById('totalKcal').innerText = `${tKcal} / 2000 kcal`;
    document.getElementById('totalProtein').innerText = `${tP.toFixed(1)}g`;
    document.getElementById('totalCarbs').innerText = `${tC.toFixed(1)}g`;
    document.getElementById('totalFat').innerText = `${tF.toFixed(1)}g`;
  }

  // Waga i Wykres
  let chart;
  function initChart() {
    const ctx = document.getElementById('weightChart').getContext('2d');
    chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: appData.weights.map(w => w.date),
        datasets: [{
          label: 'Waga (kg)',
          data: appData.weights.map(w => w.val),
          borderColor: '#10b981',
          tension: 0.2
        }]
      },
      options: { responsive: true }
    });
  }

  function addWeight() {
    const val = parseFloat(document.getElementById('weightInput').value);
    if (!val) return;
    const date = new Date().toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit' });
    appData.weights.push({ date, val });
    saveData();
    chart.data.labels.push(date);
    chart.data.datasets[0].data.push(val);
    chart.update();
    document.getElementById('weightInput').value = '';
  }

  function saveData() {
    localStorage.setItem('calorieAppData', JSON.stringify(appData));
  }
</script>
</body>
</html>
