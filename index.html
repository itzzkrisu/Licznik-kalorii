<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dziennik z historią dni</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; line-height: 1.5; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 15px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Dziennik Wpisów</h2>

  <!-- 1. Wybór daty -->
  <div class="card">
    <label for="datePicker">Wybrany dzień:</label>
    <input type="date" id="datePicker">
  </div>

  <!-- 2. Formularz dla wybranego dnia -->
  <div class="card">
    <h3 id="dayTitle">Wpisy dla dnia: </h3>
    
    <label for="weightInput">Waga (kg):</label>
    <input type="number" id="weightInput" step="0.1" placeholder="np. 72.5">

    <label for="notesInput">Notatki / Trening / Dieta:</label>
    <textarea id="notesInput" rows="4" placeholder="Wpisz szczegóły z tego dnia..."></textarea>

    <button id="saveBtn">Zapisz ten dzień</button>
  </div>

  <!-- 3. Kopia zapasowa -->
  <div class="card">
    <h3>Kopia Zapasowa (JSON)</h3>
    <button id="exportBtn">Pobierz kopię wszystkich dni</button>
    <br><br>
    <label for="importInput">Wgraj kopię z pliku JSON:</label>
    <input type="file" id="importInput" accept=".json">
  </div>

  <script>
    // Baza danych aplikacji: kluczem jest data ("YYYY-MM-DD"), a wartością dane z tego dnia
    let historyData = JSON.parse(localStorage.getItem("app_history")) || {};

    const datePicker = document.getElementById("datePicker");
    const dayTitle = document.getElementById("dayTitle");
    const weightInput = document.getElementById("weightInput");
    const notesInput = document.getElementById("notesInput");

    // Ustawienie dzisiejszej daty na start (format YYYY-MM-DD)
    const today = new Date().toISOString().slice(0, 10);
    datePicker.value = today;

    // Funkcja do ładowania danych dla wybranej daty
    function loadDateData(dateStr) {
      dayTitle.textContent = `Wpisy dla dnia: ${dateStr}`;
      
      if (historyData[dateStr]) {
        // Jeśli mamy dane dla tej daty -> wypełnij pola
        weightInput.value = historyData[dateStr].weight || "";
        notesInput.value = historyData[dateStr].notes || "";
      } else {
        // Jeśli brak danych dla tej daty -> wyczyść pola
        weightInput.value = "";
        notesInput.value = "";
      }
    }

    // Ładowanie danych na starcie dla dzisiejszego dnia
    loadDateData(today);

    // Zmiana daty w kalendarzu -> załaduj odpowiednie dane
    datePicker.addEventListener("change", (e) => {
      loadDateData(e.target.value);
    });

    // Zapisywanie danych dla wybranego dnia
    document.getElementById("saveBtn").addEventListener("click", () => {
      const selectedDate = datePicker.value;
      if (!selectedDate) return alert("Wybierz datę!");

      // Zapisujemy obiekt z danymi pod kluczem wybranej daty
      historyData[selectedDate] = {
        weight: weightInput.value,
        notes: notesInput.value,
        lastModified: new Date().toISOString()
      };

      // Zapis w localStorage (pamięci przeglądarki)
      localStorage.setItem("app_history", JSON.stringify(historyData));
      alert(`Zapisano dane dla dnia ${selectedDate}!`);
    });

    // --- EKSPORT I IMPORT PLIKÓW JSON ---

    document.getElementById("exportBtn").addEventListener("click", () => {
      const jsonString = JSON.stringify(historyData, null, 2);
      const blob = new Blob([jsonString], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `dziennik-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    document.getElementById("importInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (typeof imported === "object" && imported !== null) {
            historyData = imported;
            localStorage.setItem("app_history", JSON.stringify(historyData));
            loadDateData(datePicker.value); // Odśwież widok
            alert("Pomyślnie zaimportowano historię dni!");
          } else {
            alert("Nieprawidłowy format pliku!");
          }
        } catch (err) {
          alert("Błąd podczas odczytu pliku JSON.");
        }
      };
      reader.readAsText(file);
    });
  </script>

</body>
</html>
